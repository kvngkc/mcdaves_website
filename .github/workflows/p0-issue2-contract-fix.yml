name: Apply Issue 2 Contract Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-vto-asset-identity
          fetch-depth: 0

      - name: Apply contract fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Remove legacy glbPath from the domain contracts and seed fixtures.
          p = Path('src/lib/commerce/types.ts')
          s = p.read_text()
          s = s.replace("  // 3D & VTO Assets specific to this exact variant\n  /** @deprecated Retained for backwards compatibility but ignored by application logic. Use vtoAssetId. */\n  glbPath?: string;\n  /** Authoritative VTO asset identity */\n  vtoAssetId?: string;", "  // 3D & VTO Assets specific to this exact variant\n  /** Authoritative VTO asset identity */\n  vtoAssetId?: string;")
          s = s.replace("\n  /** @deprecated Retained for backwards compatibility but populated by repository logic based on VTO invariant. */\n  glbPath?: string;\n  /** Authoritative VTO asset identity */", "\n  /** Authoritative VTO asset identity */")
          p.write_text(s)

          p = Path('src/lib/commerce/repository.ts')
          s = p.read_text()
          import re
          s = re.sub(r"\n    glbPath: '/models/Meshy_AI_Purple_Cat_Eye_Glasse_0810153235_texture\.glb',", "", s)
          old = """    const hasPublishedVto = Boolean(\n      variant.vtoAssetId &&\n      vto &&\n      vto.asset_id === variant.vtoAssetId &&\n      vto.status === 'PUBLISHED' &&\n      typeof vto.vto_glb_url === 'string' &&\n      vto.vto_glb_url.trim() !== ''\n    );\n\n    return {\n      ...variant,"""
          new = """    const hasPublishedVto = Boolean(\n      variant.vtoAssetId &&\n      vto &&\n      vto.asset_id === variant.vtoAssetId &&\n      vto.status === 'PUBLISHED' &&\n      typeof vto.vto_glb_url === 'string' &&\n      vto.vto_glb_url.trim() !== ''\n    );\n\n    // Legacy glbPath is not part of the runtime contract. Strip it before returning\n    // the resolved variant so stale database/test fixtures cannot leak a raw GLB path.\n    const { glbPath: _legacyGlbPath, ...variantWithoutLegacyGlbPath } = variant as ProductVariant & { glbPath?: string };\n\n    return {\n      ...variantWithoutLegacyGlbPath,"""
          if old not in s:
              raise SystemExit('repository anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('tests/gate3_repository.test.ts')
          s = p.read_text()
          s = s.replace("      status: 'PUBLISHED',\n      vto_glb_url: '/models/valid.glb'", "      asset_id: 'asset-1',\n      status: 'PUBLISHED',\n      vto_glb_url: '/models/valid.glb'", 1)
          s = s.replace("expect(res.glbPath).toBe('/models/valid.glb');", "expect(res.vtoAssetId).toBe('asset-1');", 1)
          s = s.replace("expect(res.glbPath).toBeUndefined();", "expect(res.vtoAssetId).toBeUndefined();")
          s = s.replace("    });\n    expect(res.vtoAssetId).toBeUndefined(); // Legacy path is IGNORED", "    });\n    expect(res.vtoAssetId).toBeUndefined(); // Legacy path is IGNORED")
          p.write_text(s)

          p = Path('tests/gate4_vto_integration.test.ts')
          s = p.read_text()
          s = s.replace("it('correctly maps a PUBLISHED VTO asset to the variant glbPath'", "it('correctly maps a PUBLISHED VTO asset to the variant vtoAssetId'")
          s = s.replace("expect(publishedVariant?.glbPath).toBe('/models/gate4-published.glb');", "expect(publishedVariant?.vtoAssetId).toBe(publishedAssetId);")
          s = s.replace("expect(uncalibVariant?.glbPath).toBeUndefined();", "expect(uncalibVariant?.vtoAssetId).toBeUndefined();")
          s = s.replace("expect(noVtoVariant?.glbPath).toBeUndefined();", "expect(noVtoVariant?.vtoAssetId).toBeUndefined();")
          p.write_text(s)

          # No application/test source may retain the old contract.
          import subprocess
          result = subprocess.run(['git', 'grep', '-n', '-E', 'glbPath|glb_path'], '--', 'src', 'tests', 'e2e', ':!src/lib/commerce/repository.ts'], text=True, capture_output=True)
          if result.stdout.strip():
              print(result.stdout)
              raise SystemExit('legacy GLB contract references remain')
          PY

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/commerce/types.ts src/lib/commerce/repository.ts tests/gate3_repository.test.ts tests/gate4_vto_integration.test.ts
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(vto): enforce authoritative asset identity contract"
          git push origin HEAD:fix/p0-vto-asset-identity
          git rm .github/workflows/p0-issue2-contract-fix.yml
          git commit -m "chore: remove temporary Issue 2 contract workflow"
          git push origin HEAD:fix/p0-vto-asset-identity
