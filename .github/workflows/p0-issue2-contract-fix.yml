name: Apply Issue 2 Contract Fix

on:
  push:
    branches: [fix/p0-vto-asset-identity]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-vto-asset-identity
          fetch-depth: 0

      - name: Apply contract fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/lib/commerce/types.ts')
          s = p.read_text()
          s = s.replace("  // 3D & VTO Assets specific to this exact variant\n  /** @deprecated Retained for backwards compatibility but ignored by application logic. Use vtoAssetId. */\n  glbPath?: string;\n  /** Authoritative VTO asset identity */\n  vtoAssetId?: string;", "  // 3D & VTO Assets specific to this exact variant\n  /** Authoritative VTO asset identity */\n  vtoAssetId?: string;")
          s = s.replace("\n  /** @deprecated Retained for backwards compatibility but populated by repository logic based on VTO invariant. */\n  glbPath?: string;\n  /** Authoritative VTO asset identity */", "\n  /** Authoritative VTO asset identity */")
          p.write_text(s)

          p = Path('src/lib/commerce/repository.ts')
          s = p.read_text()
          s = re.sub(r"\n    glbPath: '/models/Meshy_AI_Purple_Cat_Eye_Glasse_0810153235_texture\.glb',", "", s)
          old = """    return {\n      ...variant,\n      inStock,"""
          new = """    const { glbPath: _legacyGlbPath, ...variantWithoutLegacyGlbPath } = variant as ProductVariant & { glbPath?: string };\n\n    return {\n      ...variantWithoutLegacyGlbPath,\n      inStock,"""
          if old not in s:
              raise SystemExit('repository return anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # No runtime or test code may depend on the old domain glbPath contract.
          result = __import__('subprocess').run(
              ['git', 'grep', '-n', '-E', 'glbPath|glb_path', '--', 'src', 'tests', 'e2e'],
              text=True, capture_output=True
          )
          if result.stdout.strip():
              print(result.stdout)
              # Remaining references are expected only in the explicit legacy-strip test fixture.
              allowed = [
                  'src/lib/commerce/repository.ts',
                  'tests/gate3_repository.test.ts',
                  'tests/gate4_vto_integration.test.ts',
              ]
              bad = [line for line in result.stdout.splitlines() if not any(line.startswith(a + ':') for a in allowed)]
              if bad:
                  raise SystemExit('unexpected legacy GLB references remain:\n' + '\n'.join(bad))
          PY

      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          git diff -- src/lib/commerce/types.ts src/lib/commerce/repository.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/commerce/types.ts src/lib/commerce/repository.ts
          git diff --cached --check
          git commit -m "fix(vto): remove legacy GLB domain contract" || true
          git push origin HEAD:fix/p0-vto-asset-identity
          git rm .github/workflows/p0-issue2-contract-fix.yml
          git commit -m "chore: remove temporary Issue 2 contract workflow"
          git push origin HEAD:fix/p0-vto-asset-identity
