name: Apply Issue 2 contract cleanup

on:
  push:
    branches: [fix/p0-vto-asset-identity]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-vto-asset-identity
          fetch-depth: 0

      - name: Remove legacy VTO contract fields and seed references
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/lib/commerce/types.ts')
          s = p.read_text()
          s = s.replace("  /** @deprecated Retained for backwards compatibility but ignored by application logic. Use vtoAssetId. */\n  glbPath?: string;\n", "")
          s = s.replace("\n  /** @deprecated Retained for backwards compatibility but populated by repository logic based on VTO invariant. */\n  glbPath?: string;", "")
          p.write_text(s)

          p = Path('src/lib/commerce/repository.ts')
          lines = p.read_text().splitlines(True)
          lines = [line for line in lines if '    glbPath:' not in line]
          p.write_text(''.join(lines))
          PY

      - name: Assert no runtime glbPath references remain
        run: |
          if git grep -n 'glbPath' -- 'src' 'tests' 'e2e' ':!src/**/*.d.ts'; then
            echo 'Legacy glbPath reference remains in application/test code.'
            exit 1
          fi

      - name: Commit and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/commerce/types.ts src/lib/commerce/repository.ts
          git diff --cached --quiet || git commit -m 'fix(vto): remove legacy glbPath domain contract'
          git push
          git rm .github/workflows/p0-issue2-contract-cleanup.yml
          git commit -m 'chore: remove one-shot Issue 2 cleanup workflow'
          git push
