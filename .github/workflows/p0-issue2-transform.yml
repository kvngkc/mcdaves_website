name: Apply Issue 2 VTO identity convergence

on:
  push:
    branches: [fix/p0-vto-asset-identity]

permissions:
  contents: write

jobs:
  transform:
    if: github.actor == 'kvngkc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-vto-asset-identity
          fetch-depth: 0
      - name: Apply targeted contract changes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/lib/supabase/service.ts')
          s = p.read_text()
          s = s.replace("    glbPath: row.glb_path || undefined,\n", "")
          s = s.replace("    glb_path: variant.glbPath,\n", "")
          p.write_text(s)

          p = Path('src/lib/commerce/repository.ts')
          s = p.read_text()
          s = s.replace("    const { data: variantData, error: variantError } = await supabase\n      .from('product_variants')\n      .select('*, vto_asset_calibrations(asset_id, vto_glb_url, status)')", "    const { data: variantData, error: variantError } = await supabase\n      .from('product_variants')\n      .select('*, vto_asset_calibrations(asset_id, vto_glb_url, status)')")
          s = s.replace("    // Gate 3 Invariant\n    let resolvedGlbPath: string | undefined = undefined;\n    const vto = (variant as any).vto_asset_calibrations;\n    if (vto && vto.status === 'PUBLISHED' && vto.vto_glb_url && vto.vto_glb_url.trim() !== '') {\n      resolvedGlbPath = vto.vto_glb_url;\n    }\n", "    // VTO eligibility is determined by the authoritative asset identity and its published record.\n    const vto = (variant as any).vto_asset_calibrations;\n    const hasPublishedVto = Boolean(\n      variant.vtoAssetId &&\n      vto &&\n      vto.asset_id === variant.vtoAssetId &&\n      vto.status === 'PUBLISHED' &&\n      typeof vto.vto_glb_url === 'string' &&\n      vto.vto_glb_url.trim() !== ''\n    );\n")
          s = s.replace("      glbPath: resolvedGlbPath,\n", "      vtoAssetId: hasPublishedVto ? variant.vtoAssetId : undefined,\n")
          s = s.replace("const defaultVariant = resolvedVariants.find(v => v.glbPath && v.inStock) || resolvedVariants.find(v => v.glbPath) || resolvedVariants[0]", "const defaultVariant = resolvedVariants.find(v => v.vtoAssetId && v.inStock) || resolvedVariants.find(v => v.vtoAssetId) || resolvedVariants[0]")
          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/supabase/service.ts src/lib/commerce/repository.ts
          git diff --cached --quiet || git commit -m 'fix(vto): converge commerce resolution on asset identity'
          git push
      - name: Remove transform workflow
        run: |
          git rm .github/workflows/p0-issue2-transform.yml
          git commit -m 'chore: remove one-shot Issue 2 transform workflow'
          git push
