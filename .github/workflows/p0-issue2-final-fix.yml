name: Apply Issue 2 Final Fix
on:
  push:
    branches:
      - fix/p0-vto-asset-identity
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-vto-asset-identity
          fetch-depth: 0
      - name: Fix resolver legacy leakage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/commerce/repository.ts')
          s = p.read_text()
          old = """    return {\n      ...variant,\n      inStock,"""
          new = """    const { glbPath: _legacyGlbPath, ...variantWithoutLegacyGlbPath } = variant as ProductVariant & { glbPath?: string };\n\n    return {\n      ...variantWithoutLegacyGlbPath,\n      inStock,"""
          if old not in s:
              raise SystemExit('resolver return anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          CONTENT=$(base64 -w0 src/lib/commerce/repository.ts)
          SHA=$(gh api repos/kvngkc/mcdaves_website/contents/src/lib/commerce/repository.ts?ref=fix/p0-vto-asset-identity --jq .sha)
          gh api repos/kvngkc/mcdaves_website/contents/src/lib/commerce/repository.ts \
            -X PUT \
            -f message='fix(vto): strip legacy glb path from resolved variant' \
            -f content="$CONTENT" \
            -f sha="$SHA" \
            -f branch='fix/p0-vto-asset-identity'
          TRIGGER_SHA=$(gh api repos/kvngkc/mcdaves_website/contents/.github/issue2-resolver-trigger.txt?ref=fix/p0-vto-asset-identity --jq .sha)
          gh api repos/kvngkc/mcdaves_website/contents/.github/issue2-resolver-trigger.txt \
            -X DELETE \
            -f message='chore: remove Issue 2 resolver trigger' \
            -f sha="$TRIGGER_SHA" \
            -f branch='fix/p0-vto-asset-identity'
          WORKFLOW_SHA=$(gh api repos/kvngkc/mcdaves_website/contents/.github/workflows/p0-issue2-final-fix.yml?ref=fix/p0-vto-asset-identity --jq .sha)
          gh api repos/kvngkc/mcdaves_website/contents/.github/workflows/p0-issue2-final-fix.yml \
            -X DELETE \
            -f message='chore: remove temporary Issue 2 fix workflow' \
            -f sha="$WORKFLOW_SHA" \
            -f branch='fix/p0-vto-asset-identity'
