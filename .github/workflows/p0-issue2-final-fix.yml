name: Apply Issue 2 Final Fix
on:
  push:
    branches:
      - fix/p0-vto-asset-identity
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-vto-asset-identity
          fetch-depth: 0
      - name: Fix resolver legacy leakage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/commerce/repository.ts')
          s = p.read_text()
          old = """    return {\n      ...variant,\n      inStock,"""
          new = """    const { glbPath: _legacyGlbPath, ...variantWithoutLegacyGlbPath } = variant as ProductVariant & { glbPath?: string };\n\n    return {\n      ...variantWithoutLegacyGlbPath,\n      inStock,"""
          if old not in s:
              raise SystemExit('resolver return anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git add src/lib/commerce/repository.ts
          git diff --cached --check
          git commit -m "fix(vto): strip legacy glb path from resolved variant"
          git push origin HEAD:fix/p0-vto-asset-identity
